<!DOCTYPE html>
<html lang="en">
<head>
    <title>YUNEXPRESS - GLOBAL FLEET TRACKER</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    
    <style>
        :root {
            --app-bg: #1a1d23; 
            --yun-orange: #ff6a00; 
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #ff9d5c;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: var(--app-bg); 
            font-family: 'Inter', -apple-system, sans-serif;
        }

        /* --- START SCREEN --- */
        #start-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at center, #23272f 0%, #1a1d23 100%); 
            z-index: 1000; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; transition: opacity 0.8s; 
        }

        .radar-container {
            position: relative;
            width: 320px; height: 320px;
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 20px;
        }

        .radar-ring { 
            position: absolute; 
            width: 100%; height: 100%; 
            border: 1px solid rgba(255, 106, 0, 0.15); 
            border-radius: 50%; 
        }

        .radar-sweep { 
            position: absolute; 
            width: 100%; height: 100%; 
            border-radius: 50%;
            background: conic-gradient(from -90deg at 50% 50%, transparent 270deg, rgba(255, 106, 0, 0.5) 360deg); 
            animation: sweep 3s linear infinite; 
        }

        .radar-pulse {
            position: absolute;
            width: 100%; height: 100%; 
            border-radius: 50%;
            border: 1px solid rgba(255, 106, 0, 0.2);
            animation: pulse 2.5s ease-out infinite;
        }

        @keyframes sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes pulse {
            0% { transform: scale(0.6); opacity: 1; }
            100% { transform: scale(1.2); opacity: 0; }
        }

        .commence-btn { 
            background: transparent; color: white; border: 1px solid var(--yun-orange); 
            padding: 12px 30px; border-radius: 4px; cursor: pointer; 
            font-weight: bold; letter-spacing: 2px; text-transform: uppercase;
            transition: 0.3s ease;
        }
        .commence-btn:hover { background: var(--yun-orange); box-shadow: 0 0 15px rgba(255, 106, 0, 0.3); }

        /* --- UI OVERLAYS --- */
        .app-overlay { 
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%); 
            width: 90%; max-width: 600px; z-index: 100; 
        }
        .control-panel { 
            background: var(--glass); backdrop-filter: blur(20px); 
            border: 1px solid var(--glass-border); padding: 12px 24px; 
            border-radius: 12px; display: flex; justify-content: space-between; align-items: center; 
            gap: 20px;
        }
        .panel-label { font-size: 10px; color: var(--accent); text-transform: uppercase; font-weight: bold; }
        
        select { 
            background: transparent; color: white; border: none; 
            font-weight: bold; outline: none; font-size: 14px; cursor: pointer; 
        }

        /* Toggle Switch Styling */
        .toggle-container { display: flex; align-items: center; gap: 8px; }
        .switch {
            position: relative; display: inline-block; width: 34px; height: 20px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333; transition: .4s; border-radius: 20px;
        }
        .slider:before {
            position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--yun-orange); }
        input:checked + .slider:before { transform: translateX(14px); }
        
        /* --- SIDE PANEL --- */
        .details-panel { 
            position: absolute; top: 0; right: -100%; width: 100%; 
            max-width: 400px; height: 100%; background: rgba(26, 29, 35, 0.9); 
            backdrop-filter: blur(30px); transition: right 0.6s cubic-bezier(0.16, 1, 0.3, 1); 
            color: white; border-left: 1px solid var(--glass-border); overflow-y: auto; z-index: 200; 
        }
        .details-panel.active { right: 0; }
        .spec-item { margin-bottom: 25px; border-bottom: 1px solid var(--glass-border); padding-bottom: 12px; }
        .spec-value { display: block; font-size: 15px; margin-top: 5px; color: #ffffff; }

        /* --- 3D VIEWER --- */
        model-viewer { 
            width: 100vw; height: 100vh; background-color: var(--app-bg); 
        }
        .Hotspot { 
            background: var(--yun-orange); border-radius: 50%; width: 14px; 
            height: 14px; border: 2px solid white; cursor: pointer;
            transition: opacity 0.4s ease, transform 0.3s ease;
            opacity: 1;
        }
        .Hotspot.hidden {
            opacity: 0; pointer-events: none; transform: scale(0.5);
        }
        .HotspotAnnotation { 
            background: rgba(22, 27, 34, 0.9); color: white; padding: 6px 12px; 
            border-radius: 4px; font-size: 11px; position: absolute; 
            transform: translate(20px, -50%); border: 1px solid var(--glass-border); 
            white-space: nowrap; font-weight: bold; pointer-events: none;
        }

        #ar-button {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: white; color: black; border: none; padding: 14px 28px;
            border-radius: 30px; font-weight: 800; cursor: pointer;
        }
    </style>
</head>
<body>

<div id="start-screen">
    <div class="radar-container">
        <div class="radar-ring"></div>
        <div class="radar-pulse"></div>
        <div class="radar-sweep"></div>
        <div style="z-index: 1001; text-align: center;">
            <div style="background:var(--yun-orange); color:white; padding:5px 12px; font-weight:900; font-style:italic; border-radius:4px;">YUN</div>
        </div>
    </div>
    <h1 style="color:white; letter-spacing:3px; font-weight:300; margin-bottom:40px; font-size: 18px;">GLOBAL ASSET TELEMETRY</h1>
    <button class="commence-btn" onclick="document.getElementById('start-screen').style.opacity='0'; setTimeout(()=>document.getElementById('start-screen').style.visibility='hidden', 800)">Initialize Link</button>
</div>

<div id="details-panel" class="details-panel">
    <div style="padding: 60px 40px;">
        <div class="panel-label" style="color:var(--yun-orange); margin-bottom:10px;">Classification: GSE Support</div>
        <h2 id="asset-title" style="font-weight: 300; text-transform: uppercase; margin-bottom:40px; font-size:28px;">-</h2>
        <div class="spec-item"><span class="panel-label">Operated By</span><span id="spec-crew" class="spec-value">-</span></div>
        <div class="spec-item"><span class="panel-label">Primary Zone</span><span id="spec-base" class="spec-value">-</span></div>
        <div class="spec-item"><span class="panel-label">Unit Metrics</span><span id="spec-dim" class="spec-value">-</span></div>
        <div class="spec-item"><span class="panel-label">Operational Profile</span><span id="spec-desc" class="spec-value" style="opacity:0.8; font-size:14px; line-height:1.6;">-</span></div>
        <button onclick="document.getElementById('details-panel').classList.remove('active')" style="width:100%; background:var(--yun-orange); color:white; border:none; padding:18px; border-radius:8px; font-weight:bold; cursor:pointer; margin-top:30px; text-transform:uppercase;">Return to Tracker</button>
    </div>
</div>

<div class="app-overlay">
    <div class="control-panel">
        <div>
            <div class="panel-label">Active Feed</div>
            <select id="model-select"><option>Synchronizing...</option></select>
        </div>
        
        <div class="toggle-container">
            <div class="panel-label">Hotspots</div>
            <label class="switch">
                <input type="checkbox" id="hotspot-toggle" checked>
                <span class="slider"></span>
            </label>
        </div>

        <button onclick="document.getElementById('details-panel').classList.add('active')" style="background:var(--yun-orange); color:white; border:none; padding:12px 24px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:12px;">SPECS</button>
    </div>
</div>

<model-viewer id="main-viewer" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    auto-rotate 
    shadow-intensity="1" 
    environment-image="legacy" 
    tone-mapping="neutral"
    interpolation-decay="200"
    interaction-prompt="none">
    <button slot="ar-button" id="ar-button">VIEW IN AR</button>
</model-viewer>

<script>
    const viewer = document.querySelector('#main-viewer');
    const select = document.querySelector('#model-select');
    const toggle = document.querySelector('#hotspot-toggle');
    let fleetData = [];

    async function init() {
        try {
            const res = await fetch('models.json');
            fleetData = await res.json();
            select.innerHTML = fleetData.map((m, i) => `<option value="${i}">${m.name.toUpperCase()}</option>`).join('');
            updateAsset(0);
        } catch (e) { 
            console.error("Link Failure", e); 
            document.querySelector('.panel-label').innerText = "LINK OFFLINE";
        }
    }

    function toggleHotspots() {
        const hotspots = viewer.querySelectorAll('.Hotspot');
        hotspots.forEach(h => {
            if (toggle.checked) {
                h.classList.remove('hidden');
            } else {
                h.classList.add('hidden');
            }
        });
    }

    function updateAsset(idx) {
        const asset = fleetData[idx];
        viewer.src = `models/${asset.file}.glb`;
        viewer.setAttribute('ios-src', `models/${asset.file}.usdz`);
        
        viewer.cameraOrbit = "45deg 75deg 100%";
        viewer.fieldOfView = "auto";

        // Exposure control
        if (asset.file.includes("212")) {
            viewer.exposure = "0.45";
        } else if (asset.file.includes("121")) {
            viewer.exposure = "1.5"; 
        } else {
            viewer.exposure = "1.1";
        }

        // Clean and regenerate hotspots
        viewer.querySelectorAll('.Hotspot').forEach(h => h.remove());
        
        let hotspots = [];
        if (asset.file.includes("212")) {
            hotspots = [
                { slot: "hotspot-1", pos: "-0.00289m 0.6796m 0.2817m", norm: "0m 1m 0m", label: "Main Loading Deck" },
                { slot: "hotspot-2", pos: "0.2443m 0.7675m -0.3819m", norm: "-0.34m 0.18m 0.91m", label: "Controls" },
                { slot: "hotspot-3", pos: "-0.1315m 0.0653m -0.6313m", norm: "-1m 0m 0m", label: "Engine" }
            ];
        }

        hotspots.forEach(h => {
            const b = document.createElement('button');
            b.className = 'Hotspot'; 
            // If toggle is off when loading new model, ensure hotspots start hidden
            if (!toggle.checked) b.classList.add('hidden');
            
            b.slot = h.slot;
            b.setAttribute('data-position', h.pos);
            b.setAttribute('data-normal', h.norm);
            b.setAttribute('data-visibility-attribute', 'visible');
            b.innerHTML = `<div class="HotspotAnnotation">${h.label}</div>`;
            b.onclick = () => {
                viewer.cameraTarget = h.pos;
                viewer.cameraOrbit = "0deg 90deg 2.5m";
            };
            viewer.appendChild(b);
        });

        // UI Meta Update
        document.getElementById('asset-title').innerText = asset.name;
        document.getElementById('spec-crew').innerText = asset.crew;
        document.getElementById('spec-base').innerText = asset.base;
        document.getElementById('spec-dim').innerText = `${asset.weight} / ${asset.length}`;
        document.getElementById('spec-desc').innerText = asset.description;
    }

    select.addEventListener('change', (e) => updateAsset(e.target.value));
    toggle.addEventListener('change', toggleHotspots);
    init();
</script>

</body>
</html>
