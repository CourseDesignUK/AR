<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 3D Technical Lab</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        :root { --f1-red: #e10600; }
        body { margin: 0; background: radial-gradient(circle, #222 0%, #000 100%); color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
        
        /* Viewer height adjusted for Safari mobile/desktop */
        model-viewer {
            width: 100vw;
            height: 100vh;
            --poster-color: transparent;
        }

        /* Hotspots */
        .hotspot {
            background: var(--f1-red);
            border-radius: 50%;
            border: 2px solid white;
            width: 18px;
            height: 18px;
            padding: 0;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .hotspot:not([data-visible]) { opacity: 0.3; pointer-events: none; }

        .annotation {
            background: #fff;
            color: #000;
            border-radius: 4px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: bold;
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .hotspot:hover .annotation { display: block; }
        .hotspot:hover { transform: scale(1.5); background: white; }

        .header-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
        }

        .header-ui h1 { margin: 0; font-size: 1.5rem; letter-spacing: 2px; }
        .header-ui p { color: var(--f1-red); font-weight: bold; margin: 5px 0; }
    </style>
</head>
<body>

    <div class="header-ui">
        <h1>F1 CHASSIS INSPECTOR</h1>
        <p>3D RENDER: F1.GLB</p>
    </div>

    <model-viewer 
        src="F1.GLB" 
        camera-controls 
        auto-rotate 
        shadow-intensity="1" 
        exposure="1.2"
        environment-image="neutral"
        ar-modes="webxr scene-viewer quick-look"
        camera-orbit="45deg 75deg 5m">

        <button class="hotspot" slot="hotspot-1" data-position="0 0.2 2" data-normal="0 1 0">
            <div class="annotation">FRONT WING: AERO BALANCE</div>
        </button>

        <button class="hotspot" slot="hotspot-2" data-position="0 1 -2" data-normal="0 1 0">
            <div class="annotation">DRS FLAP: DRAG REDUCTION</div>
        </button>

    </model-viewer>

    <script>
        // Log to console to help debugging in Safari
        const modelViewer = document.querySelector('model-viewer');
        modelViewer.addEventListener('error', (event) => {
            console.error("Error loading 3D model:", event.detail.type);
            alert("Model failed to load. Ensure F1.GLB is in the same folder.");
        });
    </script>
</body>
</html>
