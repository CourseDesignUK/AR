<!DOCTYPE html>
<html lang="en">
<head>
    <title>YUNEXPRESS - GLOBAL FLEET TRACKER</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    
    <style>
        :root {
            --app-bg: #1a1d23; 
            --yun-orange: #ff6a00; 
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent: #ff9d5c;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: var(--app-bg); 
            font-family: 'Inter', -apple-system, sans-serif;
            color: white;
        }

        /* --- START SCREEN --- */
        #start-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at center, #23272f 0%, #1a1d23 100%); 
            z-index: 3000; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; transition: opacity 0.8s, visibility 0.8s; 
        }

        .radar-sweep { 
            position: absolute; width: 260px; height: 260px; border-radius: 50%;
            background: conic-gradient(from -90deg at 50% 50%, transparent 270deg, rgba(255, 106, 0, 0.4) 360deg); 
            animation: sweep 3s linear infinite; 
        }
        @keyframes sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* --- TOP CONTROL PANEL --- */
        .app-overlay { 
            position: absolute; 
            top: env(safe-area-inset-top, 20px); 
            left: 50%; transform: translateX(-50%); 
            width: 92%; max-width: 600px; 
            z-index: 100; 
        }

        .control-panel { 
            background: var(--glass); 
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border); 
            padding: 12px 18px; border-radius: 14px; 
            display: flex; justify-content: space-between; align-items: center;
        }

        .panel-label { font-size: 9px; color: var(--accent); text-transform: uppercase; font-weight: 800; letter-spacing: 1px; margin-bottom: 3px; }
        select { background: transparent; color: white; border: none; font-weight: bold; font-size: 14px; outline: none; }

        /* --- BOTTOM ACTION BAR (Aeroviewer Style) --- */
        .action-bar {
            position: absolute;
            bottom: env(safe-area-inset-bottom, 30px);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 150;
        }

        .fab {
            background: var(--glass);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .fab:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--yun-orange); }
        .fab.active { background: var(--yun-orange); border-color: white; }

        /* AR Button only shows when supported */
        #ar-button { display: none; }
        model-viewer[ar-status="active"] #ar-button, 
        model-viewer.ar-ready #ar-button { display: flex; }

        /* --- SIDE PANEL --- */
        .details-panel { 
            position: fixed; top: 0; right: -100%; width: 100%; max-width: 400px; height: 100%; 
            background: rgba(20, 22, 26, 0.98); backdrop-filter: blur(30px);
            transition: right 0.5s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.5s; 
            z-index: 2000; visibility: hidden;
        }
        .details-panel.active { right: 0; visibility: visible; }
        .spec-content { padding: 80px 40px; }

        /* --- HOTSPOTS --- */
        model-viewer { width: 100vw; height: 100vh; background: #1a1d23; }
        .Hotspot { 
            background: var(--yun-orange); border-radius: 50%; width: 14px; height: 14px; 
            border: 2px solid white; cursor: pointer; transition: opacity 0.4s, transform 0.4s; 
        }
        .Hotspot.hidden { opacity: 0; transform: scale(0); pointer-events: none; }
        .HotspotAnnotation { 
            background: rgba(0, 0, 0, 0.8); color: white; padding: 5px 10px; border-radius: 4px; 
            font-size: 10px; position: absolute; transform: translate(20px, -50%); border: 1px solid var(--yun-orange);
            white-space: nowrap; pointer-events: none;
        }
    </style>
</head>
<body>

<div id="start-screen">
    <div class="radar-sweep"></div>
    <button class="commence-btn" onclick="document.getElementById('start-screen').style.opacity='0'; setTimeout(()=>document.getElementById('start-screen').style.visibility='hidden', 800)">Initialize Feed</button>
</div>

<div class="app-overlay">
    <div class="control-panel">
        <div style="display: flex; flex-direction: column;">
            <div class="panel-label">Fleet Asset</div>
            <select id="model-select"></select>
        </div>
        <button onclick="document.getElementById('details-panel').classList.add('active')" style="background:var(--yun-orange); color:white; border:none; padding:10px 18px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:11px;">SPECS</button>
    </div>
</div>

<div class="action-bar">
    <button id="toggle-hotspots" class="fab active">
        <span>●</span> Telemetry
    </button>
    <button id="ar-button" class="fab">
        <span>▽</span> View In AR
    </button>
</div>

<div id="details-panel" class="details-panel">
    <div class="spec-content">
        <h2 id="asset-title" style="color: var(--yun-orange); font-weight: 300; text-transform: uppercase;">-</h2>
        <div id="spec-list">
            <div style="margin-bottom:20px"><span class="panel-label">Description</span><p id="spec-desc" style="font-size:14px; opacity:0.8;"></p></div>
        </div>
        <button onclick="document.getElementById('details-panel').classList.remove('active')" style="width:100%; background:var(--yun-orange); color:white; border:none; padding:15px; border-radius:8px; cursor:pointer; font-weight:bold;">CLOSE</button>
    </div>
</div>

<model-viewer id="main-viewer" ar ar-modes="webxr scene-viewer quick-look" camera-controls shadow-intensity="1" tone-mapping="neutral" interaction-prompt="none">
    <div slot="ar-button" style="display:none;"></div> </model-viewer>

<script>
    const viewer = document.querySelector('#main-viewer');
    const select = document.querySelector('#model-select');
    const hotspotBtn = document.querySelector('#toggle-hotspots');
    const arBtn = document.querySelector('#ar-button');
    let fleetData = [];

    const hotspotMap = {
        "tld_121_aircraft_loader": [
            { pos: "-0.00289m 0.6796m 0.2817m", norm: "0m 1m 0m", label: "Main Loading Deck" },
            { pos: "0.2443m 0.7675m -0.3819m", norm: "-0.34m 0.18m 0.91m", label: "Controls" }
        ],
        "gpu_aiport_ground_power_unit": [
            { pos: "-1.284m 0.781m 0.054m", norm: "-1m 0m 0m", label: "Control Panel" },
            { pos: "1.134m 1.142m -0.671m", norm: "0m 0m 1m", label: "Power Cable" },
            { pos: "-1.329m 1.371m -0.083m", norm: "-1m 0m 0m", label: "Handle" }
        ]
    };

    async function init() {
        try {
            const res = await fetch('models.json');
            fleetData = await res.json();
            select.innerHTML = fleetData.map((m, i) => `<option value="${i}">${m.name.toUpperCase()}</option>`).join('');
            updateAsset(0);
        } catch (e) { console.error("Data error", e); }
    }

    function updateAsset(idx) {
        const asset = fleetData[idx];
        viewer.src = `models/${asset.file}.glb`;
        
        // UI Updates
        document.getElementById('asset-title').innerText = asset.name;
        document.getElementById('spec-desc').innerText = asset.description;

        // Hotspot management
        viewer.querySelectorAll('.Hotspot').forEach(h => h.remove());
        viewer.addEventListener('load', () => {
            const points = hotspotMap[asset.file];
            if (points) {
                points.forEach((p, i) => {
                    const b = document.createElement('button');
                    b.className = `Hotspot ${hotspotBtn.classList.contains('active') ? '' : 'hidden'}`;
                    b.slot = `hotspot-${i}`;
                    b.setAttribute('data-position', p.pos);
                    b.setAttribute('data-normal', p.norm);
                    b.innerHTML = `<div class="HotspotAnnotation">${p.label}</div>`;
                    viewer.appendChild(b);
                });
            }
        }, { once: true });
    }

    // Toggle Hotspots
    hotspotBtn.onclick = () => {
        const isActive = hotspotBtn.classList.toggle('active');
        viewer.querySelectorAll('.Hotspot').forEach(h => {
            isActive ? h.classList.remove('hidden') : h.classList.add('hidden');
        });
    };

    // AR Activation
    arBtn.onclick = () => viewer.activateAR();

    // Check for AR Support to show button
    viewer.addEventListener('ar-status', (event) => {
        if(event.detail.status === 'not-presenting') arBtn.style.display = 'flex';
    });

    select.onchange = (e) => updateAsset(e.target.value);
    init();
</script>

</body>
</html>
