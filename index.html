<!DOCTYPE html>
<html lang="en">
<head>
    <title>YUNEXPRESS - GLOBAL FLEET TRACKER</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    
    <style>
        :root {
            --app-bg: #1a1d23; 
            --yun-orange: #ff6a00; 
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #ff9d5c;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: var(--app-bg); 
            font-family: 'Inter', -apple-system, sans-serif;
        }

        /* --- START SCREEN --- */
        #start-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at center, #23272f 0%, #1a1d23 100%); 
            z-index: 1000; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; transition: opacity 0.8s; 
        }

        .radar-container {
            position: relative;
            width: 320px; height: 320px;
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 20px;
        }

        .radar-ring { position: absolute; width: 100%; height: 100%; border: 1px solid rgba(255, 106, 0, 0.15); border-radius: 50%; }
        .radar-sweep { 
            position: absolute; width: 100%; height: 100%; border-radius: 50%;
            background: conic-gradient(from -90deg at 50% 50%, transparent 270deg, rgba(255, 106, 0, 0.5) 360deg); 
            animation: sweep 3s linear infinite; 
        }
        @keyframes sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .commence-btn { 
            background: transparent; color: white; border: 1px solid var(--yun-orange); 
            padding: 12px 30px; border-radius: 4px; cursor: pointer; 
            font-weight: bold; letter-spacing: 2px; text-transform: uppercase;
        }

        /* --- UI OVERLAYS --- */
        .app-overlay { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 600px; z-index: 100; }
        .control-panel { 
            background: var(--glass); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); 
            padding: 12px 24px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; 
        }
        .panel-label { font-size: 10px; color: var(--accent); text-transform: uppercase; font-weight: bold; }
        select { background: transparent; color: white; border: none; font-weight: bold; font-size: 14px; cursor: pointer; outline: none; }

        /* Telemetry Toggle */
        .toggle-group { display: flex; align-items: center; gap: 10px; }
        .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--yun-orange); }
        input:checked + .slider:before { transform: translateX(16px); }

        /* --- SIDE PANEL --- */
        .details-panel { 
            position: absolute; top: 0; right: -100%; width: 100%; max-width: 400px; height: 100%; 
            background: rgba(26, 29, 35, 0.95); backdrop-filter: blur(30px); transition: right 0.6s cubic-bezier(0.16, 1, 0.3, 1); 
            color: white; border-left: 1px solid var(--glass-border); overflow-y: auto; z-index: 200; 
        }
        .details-panel.active { right: 0; }
        .spec-item { margin-bottom: 25px; border-bottom: 1px solid var(--glass-border); padding-bottom: 12px; }

        /* --- HOTSPOTS --- */
        model-viewer { width: 100vw; height: 100vh; }
        .Hotspot { background: var(--yun-orange); border-radius: 50%; width: 14px; height: 14px; border: 2px solid white; cursor: pointer; transition: opacity 0.3s; }
        .Hotspot.hidden { opacity: 0; pointer-events: none; }
        .HotspotAnnotation { 
            background: rgba(22, 27, 34, 0.9); color: white; padding: 6px 12px; border-radius: 4px; 
            font-size: 11px; position: absolute; transform: translate(20px, -50%); border: 1px solid var(--glass-border); 
            white-space: nowrap; font-weight: bold; pointer-events: none;
        }
    </style>
</head>
<body>

<div id="start-screen">
    <div class="radar-container">
        <div class="radar-ring"></div>
        <div class="radar-sweep"></div>
        <div style="z-index: 1001; text-align: center;">
            <div style="background:var(--yun-orange); color:white; padding:5px 12px; font-weight:900; font-style:italic; border-radius:4px;">YUN</div>
        </div>
    </div>
    <button class="commence-btn" onclick="document.getElementById('start-screen').style.opacity='0'; setTimeout(()=>document.getElementById('start-screen').style.visibility='hidden', 800)">Initialize Link</button>
</div>

<div id="details-panel" class="details-panel">
    <div style="padding: 60px 40px;">
        <h2 id="asset-title" style="font-weight: 300; text-transform: uppercase; margin-bottom:40px; font-size:28px;">-</h2>
        <div class="spec-item"><span class="panel-label">Operated By</span><span id="spec-crew" style="display:block; margin-top:5px;">-</span></div>
        <div class="spec-item"><span class="panel-label">Primary Zone</span><span id="spec-base" style="display:block; margin-top:5px;">-</span></div>
        <div class="spec-item"><span class="panel-label">Metrics</span><span id="spec-dim" style="display:block; margin-top:5px;">-</span></div>
        <div class="spec-item"><span class="panel-label">Description</span><span id="spec-desc" style="display:block; margin-top:5px; opacity:0.8; font-size:14px;">-</span></div>
        <button onclick="document.getElementById('details-panel').classList.remove('active')" style="width:100%; background:var(--yun-orange); color:white; border:none; padding:18px; border-radius:8px; cursor:pointer; font-weight:bold;">CLOSE</button>
    </div>
</div>

<div class="app-overlay">
    <div class="control-panel">
        <div>
            <div class="panel-label">Active Feed</div>
            <select id="model-select"></select>
        </div>
        <div class="toggle-group">
            <div class="panel-label">Telemetry</div>
            <label class="switch">
                <input type="checkbox" id="hotspot-toggle" checked>
                <span class="slider"></span>
            </label>
        </div>
        <button onclick="document.getElementById('details-panel').classList.add('active')" style="background:var(--yun-orange); color:white; border:none; padding:10px 20px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:11px;">SPECS</button>
    </div>
</div>

<model-viewer id="main-viewer" ar camera-controls auto-rotate shadow-intensity="1" environment-image="legacy" tone-mapping="neutral"></model-viewer>

<script>
    const viewer = document.querySelector('#main-viewer');
    const select = document.querySelector('#model-select');
    const toggle = document.querySelector('#hotspot-toggle');
    let fleetData = [];

    // Define hotspots directly in script for reliability
    const hotspotMap = {
        "tld_121_aircraft_loader": [
            { pos: "-0.00289m 0.6796m 0.2817m", norm: "0m 1m 0m", label: "Main Loading Deck" },
            { pos: "0.2443m 0.7675m -0.3819m", norm: "-0.34m 0.18m 0.91m", label: "Controls" },
            { pos: "-0.1315m 0.0653m -0.6313m", norm: "-1m 0m 0m", label: "Engine" }
        ]
    };

    async function init() {
        try {
            const res = await fetch('models.json');
            fleetData = await res.json();
            select.innerHTML = fleetData.map((m, i) => `<option value="${i}">${m.name.toUpperCase()}</option>`).join('');
            updateAsset(0);
        } catch (e) { console.error("Load Error", e); }
    }

    function updateAsset(idx) {
        const asset = fleetData[idx];
        viewer.src = `models/${asset.file}.glb`;
        
        // Apply exposure reduction for 121/212 models
        viewer.exposure = asset.file.includes("121") || asset.file.includes("212") ? "0.45" : "1.1";

        // Remove existing hotspots
        viewer.querySelectorAll('.Hotspot').forEach(h => h.remove());

        // Wait for model load to place hotspots
        viewer.addEventListener('load', () => {
            const points = hotspotMap[asset.file];
            if (points) {
                points.forEach((p, i) => {
                    const b = document.createElement('button');
                    b.className = 'Hotspot';
                    b.slot = `hotspot-${i}`;
                    b.setAttribute('data-position', p.pos);
                    b.setAttribute('data-normal', p.norm);
                    if (!toggle.checked) b.classList.add('hidden');
                    
                    b.innerHTML = `<div class="HotspotAnnotation">${p.label}</div>`;
                    b.onclick = () => {
                        viewer.cameraTarget = p.pos;
                        viewer.cameraOrbit = "0deg 80deg 2.5m";
                    };
                    viewer.appendChild(b);
                });
            }
        }, { once: true });

        // Update UI
        document.getElementById('asset-title').innerText = asset.name;
        document.getElementById('spec-crew').innerText = asset.crew;
        document.getElementById('spec-base').innerText = asset.base;
        document.getElementById('spec-dim').innerText = `${asset.weight} / ${asset.length}`;
        document.getElementById('spec-desc').innerText = asset.description;
    }

    toggle.addEventListener('change', () => {
        viewer.querySelectorAll('.Hotspot').forEach(h => {
            toggle.checked ? h.classList.remove('hidden') : h.classList.add('hidden');
        });
    });

    select.addEventListener('change', (e) => updateAsset(e.target.value));
    init();
</script>

</body>
</html>
