<!DOCTYPE html>
<html lang="en">
<head>
    <title>YUNEXPRESS - GLOBAL FLEET TRACKER</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        :root {
            --app-bg: #0b0e14;
            --yun-orange: #ff6a00; 
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent: #ff9d5c;
        }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: var(--app-bg); font-family: sans-serif; }
        #start-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #161b22 0%, #0b0e14 100%); z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.8s; }
        .radar { position: absolute; width: 400px; height: 400px; border: 1px solid rgba(255, 106, 0, 0.15); border-radius: 50%; }
        .radar::after { content: ""; position: absolute; width: 50%; height: 50%; background: conic-gradient(from 0deg, rgba(255, 106, 0, 0.25), transparent 90deg); transform-origin: 100% 100%; animation: sweep 4s linear infinite; }
        @keyframes sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .commence-btn { background: transparent; color: white; border: 1px solid var(--yun-orange); padding: 12px 30px; border-radius: 4px; cursor: pointer; font-weight: bold; letter-spacing: 2px; }
        model-viewer { width: 100vw; height: 100vh; background-color: #0f141d; }
        .Hotspot { background: var(--yun-orange); border-radius: 50%; width: 12px; height: 12px; border: 2px solid white; cursor: pointer; }
        .HotspotAnnotation { background: #161b22; color: white; padding: 6px 10px; border-radius: 4px; font-size: 10px; position: absolute; transform: translate(20px, -50%); border: 1px solid var(--glass-border); white-space: nowrap; }
        .app-overlay { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 500px; z-index: 100; }
        .control-panel { background: var(--glass); backdrop-filter: blur(15px); border: 1px solid var(--glass-border); padding: 10px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
        select { background: transparent; color: white; border: none; font-weight: bold; outline: none; font-size: 14px; }
        .details-panel { position: absolute; top: 0; right: -100%; width: 100%; max-width: 380px; height: 100%; background: rgba(11, 14, 20, 0.98); backdrop-filter: blur(25px); transition: right 0.5s; color: white; border-left: 1px solid var(--glass-border); overflow-y: auto; z-index: 200; }
        .details-panel.active { right: 0; }
        .spec-item { margin-bottom: 15px; border-bottom: 1px solid var(--glass-border); padding-bottom: 8px; }
        .spec-label { font-size: 9px; color: var(--accent); text-transform: uppercase; font-weight: bold; }
        .spec-value { display: block; font-size: 14px; margin-top: 4px; }
    </style>
</head>
<body>

<div id="start-screen">
    <div class="radar"></div>
    <div style="z-index: 1001; text-align: center;">
        <div style="background:var(--yun-orange); color:white; padding:5px 15px; display:inline-block; font-weight:900; font-style:italic; border-radius:4px; margin-bottom:20px;">YUN</div>
        <h1 style="color:white; letter-spacing:3px; font-weight:300;">GROUND ASSETS TRACKER</h1>
        <button class="commence-btn" onclick="document.getElementById('start-screen').style.opacity='0'; setTimeout(()=>document.getElementById('start-screen').style.visibility='hidden', 800)">INITIALIZE LINK</button>
    </div>
</div>

<div id="details-panel" class="details-panel">
    <div style="padding: 40px 30px;">
        <h2 id="asset-title" style="font-weight: 300; text-transform: uppercase;">-</h2>
        <div class="spec-item"><span class="spec-label">Operated By</span><span id="spec-crew" class="spec-value">-</span></div>
        <div class="spec-item"><span class="spec-label">Primary Zone</span><span id="spec-base" class="spec-value">-</span></div>
        <div class="spec-item"><span class="spec-label">Weight/Length</span><span id="spec-dim" class="spec-value">-</span></div>
        <div class="spec-item"><span class="spec-label">Operational Profile</span><span id="spec-desc" class="spec-value" style="opacity:0.8; font-size:12px; line-height:1.4;">-</span></div>
        <button onclick="document.getElementById('details-panel').classList.remove('active')" style="width:100%; background:var(--yun-orange); color:white; border:none; padding:12px; border-radius:4px; font-weight:bold; cursor:pointer; margin-top:20px;">CLOSE SPECS</button>
    </div>
</div>

<div class="app-overlay">
    <div class="control-panel">
        <div>
            <div class="spec-label">Telemetry Feed</div>
            <select id="model-select"><option>Loading...</option></select>
        </div>
        <button onclick="document.getElementById('details-panel').classList.add('active')" style="background:var(--yun-orange); color:white; border:none; padding:8px 15px; border-radius:4px; font-weight:bold; cursor:pointer;">SPECS</button>
    </div>
</div>

<model-viewer id="main-viewer" ar ar-modes="webxr scene-viewer quick-look" camera-controls auto-rotate shadow-intensity="1.5" environment-image="neutral" exposure="1.2">
    <button slot="ar-button" style="position:absolute; bottom:20px; left:50%; transform:translateX(-50%); background:white; padding:10px 20px; border-radius:30px; border:none; font-weight:bold;">DEPLOY AR</button>
</model-viewer>

<script>
    const viewer = document.querySelector('#main-viewer');
    const select = document.querySelector('#model-select');
    let fleetData = [];

    async function init() {
        try {
            const res = await fetch('models.json');
            fleetData = await res.json();
            select.innerHTML = fleetData.map((m, i) => `<option value="${i}">${m.name}</option>`).join('');
            updateAsset(0);
        } catch (e) { console.error("Data fail", e); }
    }

    function updateAsset(idx) {
        const asset = fleetData[idx];
        viewer.src = `models/${asset.file}.glb`;
        viewer.setAttribute('ios-src', `models/${asset.file}.usdz`);
        
        // Remove old hotspots
        viewer.querySelectorAll('.Hotspot').forEach(h => h.remove());

        // Specific Hotspots for TLD 121
        if (asset.file === "tld_121_aircraft_loader") {
            const hs = [
                { slot: "h1", pos: "0.23m 0.77m -0.42m", label: "Controls" },
                { slot: "h2", pos: "-0.13m 0.07m -0.63m", label: "Engine" }
            ];
            hs.forEach(h => {
                const b = document.createElement('button');
                b.className = 'Hotspot'; b.slot = h.slot;
                b.setAttribute('data-position', h.pos);
                b.innerHTML = `<div class="HotspotAnnotation">${h.label}</div>`;
                viewer.appendChild(b);
            });
        }

        document.getElementById('asset-title').innerText = asset.name;
        document.getElementById('spec-crew').innerText = asset.crew;
        document.getElementById('spec-base').innerText = asset.base;
        document.getElementById('spec-dim').innerText = `${asset.weight} / ${asset.length}`;
        document.getElementById('spec-desc').innerText = asset.description;
    }

    select.addEventListener('change', (e) => updateAsset(e.target.value));
    init();
</script>

</body>
</html>
