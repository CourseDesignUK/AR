<!DOCTYPE html>
<html lang="en">
<head>
    <title>YUNEXPRESS - GLOBAL FLEET TRACKER</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        :root {
            --app-bg: #0b0e14;
            --yun-orange: #ff6a00; 
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent: #ff9d5c;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: var(--app-bg); 
            font-family: 'Inter', -apple-system, sans-serif;
        }

        /* --- START SCREEN --- */
        #start-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at center, #161b22 0%, #0b0e14 100%); 
            z-index: 1000; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; transition: opacity 0.8s; 
        }

        .radar { 
            position: absolute; width: 400px; height: 400px; 
            border: 1px solid rgba(255, 106, 0, 0.15); border-radius: 50%; 
        }
        .radar::after { 
            content: ""; position: absolute; width: 50%; height: 50%; 
            background: conic-gradient(from 0deg, rgba(255, 106, 0, 0.25), transparent 90deg); 
            transform-origin: 100% 100%; animation: sweep 4s linear infinite; 
        }
        @keyframes sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .commence-btn { 
            background: transparent; color: white; border: 1px solid var(--yun-orange); 
            padding: 12px 30px; border-radius: 4px; cursor: pointer; 
            font-weight: bold; letter-spacing: 2px; text-transform: uppercase;
        }
        .commence-btn:hover { background: var(--yun-orange); }

        /* --- 3D VIEWER --- */
        model-viewer { 
            width: 100vw; height: 100vh; background-color: #0d1117; 
        }

        /* --- HOTSPOTS --- */
        .Hotspot { 
            background: var(--yun-orange); border-radius: 50%; width: 12px; 
            height: 12px; border: 2px solid white; cursor: pointer; 
        }
        .HotspotAnnotation { 
            background: #161b22; color: white; padding: 6px 10px; 
            border-radius: 4px; font-size: 10px; position: absolute; 
            transform: translate(20px, -50%); border: 1px solid var(--glass-border); 
            white-space: nowrap; font-weight: bold;
        }

        /* --- UI OVERLAYS --- */
        .app-overlay { 
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%); 
            width: 90%; max-width: 500px; z-index: 100; 
        }
        .control-panel { 
            background: var(--glass); backdrop-filter: blur(15px); 
            border: 1px solid var(--glass-border); padding: 10px 20px; 
            border-radius: 12px; display: flex; justify-content: space-between; align-items: center; 
        }
        .panel-label { font-size: 9px; color: var(--accent); text-transform: uppercase; font-weight: bold; }
        select { background: transparent; color: white; border: none; font-weight: bold; outline: none; font-size: 14px; cursor: pointer; }
        
        /* --- SIDE PANEL --- */
        .details-panel { 
            position: absolute; top: 0; right: -100%; width: 100%; 
            max-width: 380px; height: 100%; background: rgba(11, 14, 20, 0.98); 
            backdrop-filter: blur(25px); transition: right 0.5s cubic-bezier(0.16, 1, 0.3, 1); 
            color: white; border-left: 1px solid var(--glass-border); overflow-y: auto; z-index: 200; 
        }
        .details-panel.active { right: 0; }
        .spec-item { margin-bottom: 20px; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px; }
        .spec-value { display: block; font-size: 14px; margin-top: 5px; color: #f1f5f9; }

        #ar-button {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: white; color: black; border: none; padding: 12px 24px;
            border-radius: 30px; font-weight: 800; cursor: pointer;
        }
    </style>
</head>
<body>

<div id="start-screen">
    <div class="radar"></div>
    <div style="z-index: 1001; text-align: center;">
        <div style="background:var(--yun-orange); color:white; padding:5px 15px; display:inline-block; font-weight:900; font-style:italic; border-radius:4px; margin-bottom:20px;">YUN</div>
        <h1 style="color:white; letter-spacing:3px; font-weight:300; margin-bottom:40px;">GLOBAL ASSET TELEMETRY</h1>
        <button class="commence-btn" onclick="document.getElementById('start-screen').style.opacity='0'; setTimeout(()=>document.getElementById('start-screen').style.visibility='hidden', 800)">Initialize Link</button>
    </div>
</div>

<div id="details-panel" class="details-panel">
    <div style="padding: 50px 30px;">
        <div class="panel-label" style="color:var(--yun-orange); margin-bottom:10px;">Classification: GSE Support</div>
        <h2 id="asset-title" style="font-weight: 300; text-transform: uppercase; margin-bottom:30px; font-size:24px;">-</h2>
        <div class="spec-item"><span class="panel-label">Operated By</span><span id="spec-crew" class="spec-value">-</span></div>
        <div class="spec-item"><span class="panel-label">Primary Zone</span><span id="spec-base" class="spec-value">-</span></div>
        <div class="spec-item"><span class="panel-label">Unit Metrics</span><span id="spec-dim" class="spec-value">-</span></div>
        <div class="spec-item"><span class="panel-label">Operational Profile</span><span id="spec-desc" class="spec-value" style="opacity:0.7; font-size:13px; line-height:1.5;">-</span></div>
        <button onclick="document.getElementById('details-panel').classList.remove('active')" style="width:100%; background:var(--yun-orange); color:white; border:none; padding:15px; border-radius:8px; font-weight:bold; cursor:pointer; margin-top:20px; text-transform:uppercase;">Return to Tracker</button>
    </div>
</div>

<div class="app-overlay">
    <div class="control-panel">
        <div>
            <div class="panel-label">Active Feed</div>
            <select id="model-select"><option>Synchronizing...</option></select>
        </div>
        <button onclick="document.getElementById('details-panel').classList.add('active')" style="background:var(--yun-orange); color:white; border:none; padding:10px 20px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:11px;">SPECS</button>
    </div>
</div>

<model-viewer id="main-viewer" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    auto-rotate 
    shadow-intensity="2" 
    shadow-softness="1"
    environment-image="neutral" 
    tone-mapping="commerce"
    exposure="0.75" 
    interaction-prompt="none">
    <button slot="ar-button" id="ar-button">DEPLOY USDZ TO SPACE</button>
</model-viewer>

<script>
    const viewer = document.querySelector('#main-viewer');
    const select = document.querySelector('#model-select');
    let fleetData = [];

    async function init() {
        try {
            const res = await fetch('models.json');
            fleetData = await res.json();
            select.innerHTML = fleetData.map((m, i) => `<option value="${i}">${m.name}</option>`).join('');
            updateAsset(0);
        } catch (e) { 
            console.error("Link Failure", e); 
            document.querySelector('.panel-label').innerText = "LINK OFFLINE";
        }
    }

    function updateAsset(idx) {
        const asset = fleetData[idx];
        viewer.src = `models/${asset.file}.glb`;
        viewer.setAttribute('ios-src', `models/${asset.file}.usdz`);
        
        // Remove existing hotspots
        viewer.querySelectorAll('.Hotspot').forEach(h => h.remove());

        // Lighting & Hotspot Override for TLD 121
        if (asset.file === "tld_121_aircraft_loader") {
            viewer.exposure = "0.85"; // Slightly higher for complex textures
            const hs = [
                { slot: "h1", pos: "0.236m 0.772m -0.420m", label: "Controls" },
                { slot: "h2", pos: "-0.130m 0.075m -0.635m", label: "Engine" },
                { slot: "h3", pos: "0.010m 0.679m 0.442m", label: "Main Deck" }
            ];
            hs.forEach(h => {
                const b = document.createElement('button');
                b.className = 'Hotspot'; b.slot = h.slot;
                b.setAttribute('data-position', h.pos);
                b.innerHTML = `<div class="HotspotAnnotation">${h.label}</div>`;
                viewer.appendChild(b);
            });
        } else {
            viewer.exposure = "0.75"; // Darker for standard models
        }

        // Meta Injection
        document.getElementById('asset-title').innerText = asset.name;
        document.getElementById('spec-crew').innerText = asset.crew;
        document.getElementById('spec-base').innerText = asset.base;
        document.getElementById('spec-dim').innerText = `${asset.weight} / ${asset.length}`;
        document.getElementById('spec-desc').innerText = asset.description;
    }

    select.addEventListener('change', (e) => updateAsset(e.target.value));
    init();
</script>

</body>
</html>
