<model-viewer id="main-viewer" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    auto-rotate 
    shadow-intensity="2" 
    shadow-softness="1"
    environment-image="neutral" 
    tone-mapping="commerce"
    exposure="0.7" 
    interaction-prompt="none">
    <button slot="ar-button" style="position:absolute; bottom:20px; left:50%; transform:translateX(-50%); background:white; padding:10px 20px; border-radius:30px; border:none; font-weight:bold;">DEPLOY AR</button>
</model-viewer>

<script>
    // ... (rest of your init function)

    function updateAsset(idx) {
        const asset = fleetData[idx];
        viewer.src = `models/${asset.file}.glb`;
        viewer.setAttribute('ios-src', `models/${asset.file}.usdz`);
        
        viewer.querySelectorAll('.Hotspot').forEach(h => h.remove());

        // Lighting Overrides for specific assets
        if (asset.file === "tld_121_aircraft_loader") {
            // Lowering from your previous 1.3 to a more grounded 0.8
            viewer.exposure = "0.8"; 
            viewer.shadowIntensity = "2";
            
            // Re-adding your hotspots
            const hs = [
                { slot: "h1", pos: "0.23m 0.77m -0.42m", label: "Controls" },
                { slot: "h2", pos: "-0.13m 0.07m -0.63m", label: "Engine" }
            ];
            hs.forEach(h => {
                const b = document.createElement('button');
                b.className = 'Hotspot'; b.slot = h.slot;
                b.setAttribute('data-position', h.pos);
                b.innerHTML = `<div class="HotspotAnnotation">${h.label}</div>`;
                viewer.appendChild(b);
            });
        } else {
            // Standard dimmed lighting for all other trucks
            viewer.exposure = "0.7";
            viewer.shadowIntensity = "1.5";
        }

        // ... (rest of your metadata injection)
    }
</script>
