<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Classic F1 3D Tech</title>
    <style>
        body { margin: 0; background: #050505; color: white; font-family: sans-serif; overflow: hidden; }
        #container { width: 100vw; height: 100vh; position: relative; }
        
        /* Classic Hotspot Overlay */
        .hotspot-label {
            position: absolute;
            background: rgba(225, 6, 0, 0.9);
            color: white;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            pointer-events: auto;
            cursor: pointer;
            border: 1px solid white;
            transform: translate(-50%, -50%);
        }

        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="container">
        <div class="ui-overlay">
            <h1 style="margin:0; font-style: italic;">F1.GLB INSPECTOR</h1>
            <p style="color: #666;">Legacy Three.js Engine</p>
        </div>
        
        <div id="hotspot-3" class="hotspot-label" style="display:none;">Rain Light</div>
        <div id="hotspot-4" class="hotspot-label" style="display:none;">Rear Wing</div>
        <div id="hotspot-6" class="hotspot-label" style="display:none;">Halo</div>
    </div>

    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, model, controls;

        init();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(5, 2, 8);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.toneMapping = THREE.NeutralToneMapping;
            document.getElementById('container').appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            const sunLight = new THREE.DirectionalLight(0xffffff, 1);
            sunLight.position.set(5, 10, 7.5);
            scene.add(sunLight);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const loader = new GLTFLoader();
            loader.load('F1.GLB', function(gltf) {
                model = gltf.scene;
                scene.add(model);
                animate();
            }, undefined, function(error) {
                console.error("Model Error:", error);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            
            // This is where you map 3D coordinates to the 2D screen
            updateHotspot('hotspot-4', new THREE.Vector3(2.3, 1.04, 2.53)); 
            
            renderer.render(scene, camera);
        }

        function updateHotspot(id, pos3D) {
            const el = document.getElementById(id);
            const vector = pos3D.clone().project(camera);
            
            const x = (vector.x + 1) * window.innerWidth / 2;
            const y = -(vector.y - 1) * window.innerHeight / 2;
            
            el.style.display = 'block';
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
        }
    </script>
</body>
</html>
