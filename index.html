<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Tech & Specs Explorer</title>
    <style>
        :root {
            --f1-red: #e10600;
            --dark-grey: #15151e;
            --carbon: #2b2b2b;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--dark-grey);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .app-wrapper {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
        }

        .container {
            position: relative;
            background: #000;
            border-radius: 12px;
            border: 1px solid #444;
            overflow: hidden;
        }

        .car-image {
            width: 100%;
            display: block;
            opacity: 0.7;
        }

        /* Hotspots */
        .hotspot {
            position: absolute;
            width: 18px;
            height: 18px;
            background-color: var(--f1-red);
            border: 2px solid white;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
        }

        /* Side Panel Specs */
        .spec-panel {
            background: var(--carbon);
            padding: 20px;
            border-radius: 12px;
            border-top: 4px solid var(--f1-red);
        }

        .spec-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .spec-table td {
            padding: 10px 0;
            border-bottom: 1px solid #444;
            font-size: 0.9rem;
        }

        .spec-label { color: #aaa; }
        .spec-value { text-align: right; font-weight: bold; color: var(--f1-red); }

        #info-box {
            grid-column: span 2;
            background: #1f1f1f;
            padding: 20px;
            border-radius: 8px;
            margin-top: 10px;
        }

        @media (max-width: 900px) {
            .app-wrapper { grid-template-columns: 1fr; }
            #info-box { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <h1>F1 Constructor Intelligence</h1>
