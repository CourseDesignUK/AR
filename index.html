<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D F1 Car Tech Explorer</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        body { margin: 0; background-color: #0b0b0b; color: white; font-family: 'Orbitron', sans-serif; }
        
        /* The 3D Viewport */
        model-viewer {
            width: 100%;
            height: 90vh;
            --poster-color: transparent;
        }

        /* Hotspot Styling */
        .hotspot {
            background: #e10600;
            border-radius: 50%;
            border: 2px solid #fff;
            width: 20px;
            height: 20px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .hotspot:hover { transform: scale(1.4); background: #fff; }

        /* The Info Label */
        .annotation {
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            display: none; /* Hidden by default */
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
        }

        .hotspot:hover .annotation { display: block; }

        .ui-panel {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            background: rgba(0,0,0,0.7);
            padding: 10px 30px;
            border-radius: 50px;
        }
    </style>
</head>
<body>

    <model-viewer 
        src="F1.GLB" 
        camera-controls 
        auto-rotate 
        shadow-intensity="2" 
        exposure="1"
        environment-image="neutral">
        
        <button class="hotspot" slot="hotspot-front" data-position="0m 0.3m 2m" data-normal="0m 1m 0m">
            <div class="annotation">Front Wing: Downforce Generation</div>
        </button>

        <button class="hotspot" slot="hotspot-rear" data-position="0m 1m -2m" data-normal="0m 1m 0m">
            <div class="annotation">DRS System: Top Speed Boost</div>
        </button>

    </model-viewer>

    <div class="ui-panel">
        <h1>2026 SPEC PROTOTYPE</h1>
        <p>Interact with the model to explore components</p>
    </div>

</body>
</html>
